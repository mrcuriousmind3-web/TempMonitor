name: Build TempMonitor
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish TempMonitor.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TempMonitor-Windows-x64
          path: bin/Release/net8.0-windows/win-x64/publish/TempMonitor.exe
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net8.0-windows/win-x64/publish/TempMonitor.exe

